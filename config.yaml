# =============================================================
#  공고 브리핑 설정 파일
#  이 파일만 고치면 됩니다. 고친 뒤 GitHub에 커밋하면 다음 실행부터 반영됩니다.
# =============================================================

# -------------------------------------------------------------
# 1. 메일 받을 사람  ← 여기에 한 줄씩 추가하세요
# -------------------------------------------------------------
# ⚠️ 실제 주소는 여기에 적지 않는 것을 권장합니다.
#    GitHub Secrets 의 MAIL_TO 에 넣으면 저장소에 주소가 남지 않습니다.
#    (MAIL_TO 가 있으면 아래 목록은 무시됩니다)
#
# ⚠️ 실제 주소를 여기에 적을 때는 아래 예시 두 줄을 반드시 지우세요.
#    example.com 주소가 남아 있으면 그 주소로도 발송을 시도해 실패합니다.
recipients:
  - dlehdbs0716@gmail.com
  
# - person1@example.com
# - person2@example.com

# 메일 제목 앞에 붙는 말머리
subject_prefix: "[공고 브리핑]"

# 보내는 사람 표시 이름
sender_name: "공고 브리핑"


# -------------------------------------------------------------
# 2. 공고를 고르는 조건
# -------------------------------------------------------------
# 게시일이 오늘로부터 며칠 전까지인 공고를 볼지 (10 = 오늘 포함 최근 10일)
lookback_days: 10

# 한 기관에서 최대 몇 건까지 메일에 넣을지
max_per_institution: 5

# 마감일이 지난 공고를 제외할지
exclude_expired: true

# 게시일을 읽을 수 없는 공고(목록에 날짜 컬럼이 없는 게시판)를 어떻게 할지
#   include : 포함 — '최근 10일' 판단을 못 하니 마감일로만 걸러집니다  ← 현재 설정
#   exclude : 제외 — 오래된 공고가 섞이는 게 싫을 때
# 해당 기관: 고령친화산업지원센터, 전북테크노파크, 한국사회적기업진흥원 등
unknown_posted: include

# 마감일을 끝까지 못 읽은 공고를 어떻게 할지
#   include_flagged : 포함하되 '마감일 확인필요'로 표시  ← 현재 설정
#   exclude         : 제외 (마감된 공고가 절대 오면 안 될 때)
unknown_deadline: include_flagged

# 목록에 마감일이 없으면 공고 상세 페이지를 열어서 접수기간을 읽습니다.
# 게시판 목록에 마감일이 없는 기관이 20곳 넘어서, 이게 꺼져 있으면
# 이미 끝난 공고가 걸러지지 않습니다. 켜두는 것을 권장합니다.
verify_deadline: true
verify_max: 60        # 한 번 실행에 최대 몇 건까지 상세 페이지를 열지
verify_timeout: 15    # 상세 페이지 한 건당 대기 초
verify_delay: 0.4     # 상세 페이지 요청 간격(초)

# 이미 한 번 보낸 공고를 다시 보내지 않을지
dedupe: true

# 포함 키워드가 하나도 없는 공고를 버릴지
#   true  : 포함 키워드가 최소 1개 있어야 메일에 들어감  ← 현재 설정
#   false : 키워드와 무관하게 전부 넣음
require_keyword: true

# 수집 결과가 0건이어도 메일을 보낼지 (시스템이 살아있는지 확인용)
send_when_empty: true


# -------------------------------------------------------------
# 2-1. 누적 기록 (지금까지 찾은 공고를 한 파일에 모아둡니다)
# -------------------------------------------------------------
# 매일 실행될 때마다 그날 메일로 보낸 공고가 누적 목록에 쌓입니다.
#   state/archive.csv   원본. 매일 GitHub에 커밋됩니다.
#   공고누적.xlsx        보기용. 아래 요일에 저장소가 갱신되고 메일에도 첨부됩니다.
# 그날 찾은 공고만 담은 엑셀을 매일 메일에 첨부할지
# 파일명: 공고브리핑_2026-09-09.xlsx · 누적본과 컬럼·서식이 완전히 같습니다
# 팀에 그대로 전달하기 좋으라고 매일 첨부합니다 (0건인 날은 첨부하지 않음)
daily_xlsx: true

archive_enabled: true

# 저장소의 공고누적.xlsx 를 갱신하고 메일에 첨부할 요일
#   0=월 1=화 2=수 3=목 4=금 5=토 6=일
# 기본은 월·수·금. 매일 갱신하려면 [0,1,2,3,4] 로, 월요일만이면 [0] 으로 바꾸세요.
archive_attach_weekdays: [0, 2, 4]


# -------------------------------------------------------------
# 3. 포함 키워드  ← 이 중 하나라도 제목에 있으면 채택
# -------------------------------------------------------------
include_keywords:
  - 시니어
  - 고령
  - 노인
  - 돌봄
  - 에이지테크
  - Age-Tech
  - 디지털 전환
  - 디지털전환
  - AX
  - 디지털헬스
  - 헬스케어
  - 재난안전
  - 안전
  - 클라우드
  - 마케팅
  - 홍보
  - 판로
  - 수출
  - 표창
  - 유공
  - 포상
  - 인증
  - 특례보증
  - 실증
  - IoT
  - 사회서비스
  - 스마트


# -------------------------------------------------------------
# 4. 제외 키워드  ← 제목에 하나라도 있으면 무조건 버림 (포함 키워드보다 우선)
# -------------------------------------------------------------
exclude_keywords:
  - 채용
  - 모집공고(직원
  - 인사
  - 입찰
  - 낙찰
  - 용역
  - 계약
  - 견적
  - 구매
  - 매각
  - 임대
  - 발주
  - 결과 발표
  - 선정 결과
  - 최종 선정
  - 합격
  - 개인정보
  - 처리방침
  - 휴무
  - 임시공휴일
  - 정기점검
  - 시스템 점검
  - 설립허가
  - 청산
  - 해산
  - 행정처분
  - 사전통지
  - 의견제출
  - 리플릿
  - 브로슈어
  - 카드뉴스
  - 웹진


# -------------------------------------------------------------
# 5. 구글시트 연동 (선택)
# -------------------------------------------------------------
# 키워드·수신자·기관을 구글시트에서 관리하고 싶을 때 씁니다.
# 인증키가 필요 없어서 **다른 구글 계정의 시트라도 연동됩니다.**
#
# 만드는 법
#   1) 구글시트에 탭 3개를 만듭니다 (동봉한 설정시트 템플릿을 올리면 그대로 됩니다)
#   2) 파일 → 공유 → 웹에 게시
#   3) 탭을 하나 고르고 형식을 '쉼표로 구분된 값(.csv)'으로 선택 → 게시
#   4) 나온 주소를 아래에 붙여넣습니다. 탭마다 따로 게시해야 합니다.
#
# ⚠️ '웹에 게시'한 시트는 주소를 아는 사람이면 누구나 볼 수 있습니다.
#    동료 이메일을 노출하고 싶지 않으면 recipients_url 은 비워두고
#    수신자는 위 recipients 목록으로 관리하세요.
#
# 주소를 비워두거나 시트를 못 읽으면 이 파일의 설정을 그대로 씁니다.
# 브리핑이 멈추는 일은 없습니다.
sheet:
  enabled: true
  timeout: 20

  # 브라우저 주소창에서 복사한 주소를 그대로 넣어도 됩니다.
  # 프로그램이 알아서 CSV로 읽히는 주소로 바꿉니다.
  include_keywords_url: "https://docs.google.com/spreadsheets/d/1Mf3bRkTTbl-LhRSBsqcP1zOTZe4pN4A9Fn2EsP7aZko/edit?gid=441632177#gid=441632177"
  exclude_keywords_url: "https://docs.google.com/spreadsheets/d/1Mf3bRkTTbl-LhRSBsqcP1zOTZe4pN4A9Fn2EsP7aZko/edit?gid=638297793#gid=638297793"
  institutions_url: "https://docs.google.com/spreadsheets/d/1Mf3bRkTTbl-LhRSBsqcP1zOTZe4pN4A9Fn2EsP7aZko/edit?gid=32003561#gid=32003561"

  # 수신자는 시트에 두지 않습니다 (이메일 노출 방지). 위 recipients 로 관리하세요.
  recipients_url: ""

  # 포함·제외를 한 탭에 '구분' 칸으로 넣었을 때만 씁니다. 보통 비워둡니다.
  keywords_url: ""



# -------------------------------------------------------------
# 6. 네트워크 설정 (보통 건드릴 일 없음)
# -------------------------------------------------------------
http:
  timeout: 30          # 한 기관당 최대 대기 초 (정부 사이트는 느릴 때가 많음)
  retries: 2           # 실패 시 재시도 횟수
  delay_between: 1.0   # 기관 간 요청 간격(초)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
