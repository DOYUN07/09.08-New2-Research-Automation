name: 누적 기록 초기화

# 발송 이력과 누적 목록을 전부 지웁니다.
# Actions 탭 → "누적 기록 초기화" → Run workflow → 확인란에 RESET 입력 → 실행
#
# 지우고 나면 다음 실행 때 최근 10일치 공고가 '전부 신규'로 취급되어
# 평소보다 훨씬 두꺼운 메일이 한 번 옵니다. 그 다음부터는 다시 정상입니다.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "실행하려면 RESET 이라고 입력하세요 (실수 방지용)"
        required: true
        default: ""
      what:
        description: "무엇을 지울지"
        type: choice
        options:
          - "전부 (발송 이력 + 누적 목록)"
          - "누적 목록만 (발송 이력은 유지)"
        default: "전부 (발송 이력 + 누적 목록)"

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 확인 문구 검사
        run: |
          if [ "${{ inputs.confirm }}" != "RESET" ]; then
            echo "확인란에 RESET 이라고 정확히 입력해야 실행됩니다."
            echo "입력된 값: '${{ inputs.confirm }}'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: 파일 지우기
        run: |
          set -e
          echo "지우기 전 상태:"
          [ -f state/seen.json ]   && echo "  seen.json    $(wc -c < state/seen.json) 바이트"   || echo "  seen.json    없음"
          [ -f state/archive.csv ] && echo "  archive.csv  $(wc -l < state/archive.csv) 줄"      || echo "  archive.csv  없음"
          [ -f 공고누적.xlsx ]      && echo "  공고누적.xlsx $(wc -c < 공고누적.xlsx) 바이트"      || echo "  공고누적.xlsx 없음"

          rm -f state/archive.csv "공고누적.xlsx"

          if [ "${{ inputs.what }}" = "전부 (발송 이력 + 누적 목록)" ]; then
            mkdir -p state
            echo '{"items": {}}' > state/seen.json
            echo ""
            echo "→ 발송 이력과 누적 목록을 모두 비웠습니다."
          else
            echo ""
            echo "→ 누적 목록만 비웠습니다. 발송 이력은 그대로입니다."
            echo "   (이미 보낸 공고는 다시 안 잡히므로 누적 목록은 앞으로 쌓이는 것만 들어갑니다)"
          fi

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/
          git add -A -- '*.xlsx'
          if git diff --staged --quiet; then
            echo "이미 비어 있어서 바뀐 게 없습니다."
          else
            git commit -m "chore: 누적 기록 초기화 ($(date -u +%Y-%m-%d))"
            git push
            echo "완료. 이제 '평일 공고 브리핑'을 실행하면 새로 쌓이기 시작합니다."
          fi
