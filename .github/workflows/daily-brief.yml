name: 평일 공고 브리핑

on:
  schedule:
    # UTC 01:00 = 한국시간 10:00 · 요일 1-5 = 월~금 (주말 제외)
    #   → 오전 정기 브리핑. 신규 0건이어도 '살아 있다'는 확인용으로 발송합니다.
    - cron: "0 1 * * 1-5"
    # UTC 08:00 = 한국시간 17:00 · 평일
    #   → 오후 실행. 두 가지를 같이 합니다.
    #     ① 오전에 접속이 막혔던 기관(정부 부처 등)을 다시 수집
    #     ② 오전 이후 새로 올라온 공고를 추가 수집
    #   신규 0건이면 메일을 보내지 않습니다(--only-if-new).
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "메일을 보내지 않고 결과만 확인"
        type: boolean
        default: false
      only_if_new:
        description: "신규 공고가 있을 때만 발송 (오후 실행과 동일하게)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 실행
        env:
          # ↓ GitHub Secrets 에 등록하면 발송이 켜집니다. 없으면 결과 파일만 만들고 넘어갑니다.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # ↓ 선택. 등록하면 config.yaml 의 recipients 대신 이 값을 씁니다 (쉼표 구분)
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # ↓ 선택. 공공데이터포털 인증키. 나중에 추가해도 됩니다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # 오후(UTC 08:00) 정기 실행이거나, 수동 실행에서 체크했으면 조용한 모드
          if [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ] \
             || [ "${{ inputs.only_if_new }}" = "true" ]; then
            ARGS="$ARGS --only-if-new"
            echo "오후 실행 — 신규 공고가 있을 때만 발송합니다"
          fi
          echo "실행: python -m src.main$ARGS"
          python -m src.main $ARGS

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: 발송 이력·누적 기록 커밋
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/ 아래 전부 + 저장소 최상단의 누적 엑셀
          git add -A state/
          # 누적 엑셀은 월·수·금에만 만들어진다. 없는 날 'git add' 는
          # "pathspec did not match any files" 로 종료코드 128 을 내고,
          # 이 셸이 bash -e 라 단계 전체가 거기서 중단된다.
          # 그러면 바로 위에서 add 한 state/ 도 커밋되지 않아
          # '이미 보낸 공고' 기록이 날아가고 다음 실행이 같은 공고를 또 보낸다.
          # 파일이 없는 날은 조용히 넘어가야 한다.
          git add -A -- '*.xlsx' 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 발송 이력·누적 기록 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            # 하루 두 번 실행하므로 다른 실행이 먼저 커밋했을 수 있다.
            # 그냥 push 하면 non-fast-forward 로 실패하니 최신을 받아 얹는다.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
