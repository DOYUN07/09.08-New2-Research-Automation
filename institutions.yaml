    name: 한국바이오특화센터협의회
    enabled: false
    status: none
    url: ""
    base: ""
    notes: "⚠️ 이 명칭의 기관·홈페이지를 찾지 못했습니다. 기관명 확인 필요. 후보: 한국바이오협회(koreabio.org), 한국제약바이오협회(kpbma.or.kr), 또는 개별 지역 바이오특화센터."
