  - id: khidi
    name: 한국보건산업진흥원
    enabled: true
    status: ok
    url: "https://www.khidi.or.kr/board?menuId=MENU01108"
    base: "https://www.khidi.or.kr"
    notes: "알림·소식 > 사업공고. 첫 행은 '공지' 고정글."

  - id: khidi_esenior
    name: 고령친화산업지원센터
    enabled: true
    status: check
    url: "https://www.khidi.or.kr/board?menuId=MENU00325&siteId=SITE00003"
    base: "https://www.khidi.or.kr"
    notes: "KHIDI 산하 센터(/esenior)로 독립 도메인 없음. 센터 전용 공고게시판은 2021년 테스트글 1건뿐이라 센터공지를 사용. 목록에 등록일이 없어 게시일 미확인으로 나올 수 있음."

  - id: ssis
    name: 한국사회보장정보원
    enabled: true
    status: ok
    url: "https://www.ssis.or.kr/lay1/bbs/S1T67C95/A/102/list.do"
    base: "https://www.ssis.or.kr/lay1/bbs/S1T67C95/A/102/"
    notes: "지원사업 전용 게시판이 없어 공지사항에서 수집. 페이지 용량 약 2.8MB로 무거움."

  - id: kcpass
    name: 중앙사회서비스원
    enabled: true
    status: check
    url: "https://www.kcpass.or.kr/board?menuId=MENU002030101000000"
    base: "https://www.kcpass.or.kr"
    notes: "지원사업 공고가 일반공지에 섞임. 채용은 MENU002030601000000이므로 제외됨. 미검증."

  - id: kstartup
    name: K-Startup(창업진흥원)
    enabled: true
    status: ok
    url: "https://www.k-startup.go.kr/web/contents/bizpbanc-ongoing.do?schM=list&page=1"
    base: "https://www.k-startup.go.kr"
    link_from_onclick: "go_view\\((\\d+)\\)"
    detail_url: "https://www.k-startup.go.kr/web/contents/bizpbanc-ongoing.do?schM=view&pbancSn={id}&page=1"
    notes: "공공데이터포털 오픈API(data.go.kr/data/15125364)로 대체 가능 — DATA_GO_KR_KEY 등록 시 자동 전환."

  - id: socialenterprise
    name: 한국사회적기업진흥원
    enabled: true
    status: check
    url: "https://socialenterprise.or.kr/homepage/main.do"
    base: "https://socialenterprise.or.kr"
    notes: >
      엑셀의 '한국사회기술원'은 실존 명칭이 아니어서 이 기관으로 판단.
      구 주소(/social/board/list.do)는 1·2차 진단 모두 HTTP 404 → 사용자가 알려준
      새 주소로 교체. 다만 이것은 게시판이 아니라 메인 페이지이므로, 파서가
      메인에 노출된 공지·공고 영역을 집어올 수 있고 배너·메뉴를 잘못 집을 수도 있다.
      다음 진단에서 수집 건수와 샘플 제목을 확인할 것. 결과가 이상하면
      메인에서 '알림·소식 > 공지사항' 게시판으로 들어간 실제 목록 주소로 바꿀 것.

  - id: ekr
    name: 한국농어촌공사
    enabled: false
    status: check
    url: "https://www.ekr.or.kr/planweb/board/list.krc?boardUid=402880317cc0644a017cc5e8000f06b7&contentUid=402880317cc0644a017cc0c9da9f0120"
    base: "https://www.ekr.or.kr"
    notes: "기본 비활성. 공지사항이 조달·설계공모 위주라 기업 지원사업 적합도가 낮음. 필요하면 enabled: true로."

  # ---------- 5. 정적 수집이 안 되는 곳 (기본 비활성) ----------
  - id: kotra
    name: KOTRA
