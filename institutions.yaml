    url: "https://www.nipa.kr/home/2-2"
    base: "https://www.nipa.kr"
    notes: "신규 CMS 경로. 용역 입찰공고가 섞여 들어오므로 제외 키워드 필수. 구 경로는 404."

  - id: nia
    name: 한국지능정보사회진흥원(NIA)
