    status: js
    url: "https://www.kotra.or.kr/subList/20000020753"
    base: "https://www.kotra.or.kr"
    notes: "목록이 JavaScript 렌더링이라 정적 수집 불가. 기업마당(bizinfo)에 재수집되므로 그쪽 경유 권장."

