# =============================================================
#  수집 대상 기관 목록
#  - enabled: false 로 바꾸면 그 기관은 건너뜁니다.
#  - 기관을 추가하려면 id / name / url 만 있으면 됩니다.
#    (선택자를 비워두면 범용 파서가 알아서 목록을 찾습니다)
#  - status 는 2026-09-07 사전조사 결과입니다:
#      ok        목록 파싱 확인됨
#      check     URL은 찾았으나 미검증 — 첫 진단 실행에서 확인 필요
#      js        JavaScript 렌더링 → 정적 수집 불가
#      blocked   서버가 봇/데이터센터 IP를 차단
#      none      지원사업 공고 게시판이 사실상 없음
# =============================================================

institutions:

  # ---------- 1. 부산 ----------
  - id: bipa
    name: 부산정보산업진흥원
    enabled: true
    status: ok
    url: "https://bipa.kr/board/business/list"
    base: "https://bipa.kr"
    notes: "구 busanit.or.kr에서 도메인 이전. 목록에 마감기한 컬럼 있음. 채용은 /board/job/list로 분리."

  - id: btp
    name: 부산테크노파크
    enabled: true
    status: ok
    url: "https://www.btp.or.kr/kor/CMS/Board/Board.do?mCode=MN013"
    base: "https://www.btp.or.kr/kor/CMS/Board/Board.do"
    notes: "번호/사업공고명/접수기간/상태/작성자/게시일. 상대경로 href."

  - id: bepa
    name: 부산경제진흥원
    enabled: true
    status: check
    url: "https://www.bepa.kr/kor/view.do?no=1508"
    base: "https://www.bepa.kr/kor/"
    verify_ssl: false
    notes: "서버가 중간 인증서 체인을 안 보내 SSL 오류 발생 → verify_ssl:false 로 우회. no=1509는 채용이라 제외."

  - id: busan_pass
    name: 부산사회서비스원
    enabled: true
    status: ok
    url: "https://busan.pass.or.kr/SW_bbs/notice/list.php?zipEncode==u2yPr3BU91vt1drjrMCH9MyMetpSfMvWLME"
    base: "https://busan.pass.or.kr/SW_bbs/notice/"
    notes: "URL이 zipEncode 토큰 기반이라 목록의 href를 그대로 따라가야 함. 날짜가 26.08.05 형식(2자리 연도)."

  - id: busan_ngocenter
    name: 부산시민운동지원센터
    enabled: true
    status: ok
    url: "https://www.ngocenter.or.kr/business/business"
    base: "https://www.ngocenter.or.kr"
    notes: "센터사업 게시판. 제목 말머리 [모집]/[안내]/[후기] 혼재."

  # ---------- 2. 타지역 테크노파크·진흥원 ----------
  - id: gjtp
    name: 광주테크노파크
    enabled: true
    status: ok
    url: "https://www.gjtp.or.kr/home/business.cs"
    base: "https://www.gjtp.or.kr/home/business.cs"
    notes: "한 페이지 30건. 접수기간 컬럼이 '2026-09-03 ~ 2026-09-14' 형태라 마감일 추출 가능. 번호 셀이 th."

  - id: gntp
    name: 경남테크노파크
    enabled: true
    status: ok
    url: "https://www.gntp.or.kr/biz/apply"
    base: "https://www.gntp.or.kr"
    link_from_onclick: "'(/biz/applyInfo/\\d+)'"
    detail_url: "https://www.gntp.or.kr{id}"
    notes: "링크가 onclick=goPage(...) 안에 있음. 게시일 컬럼이 없어 접수시작일을 게시일로 사용. 2페이지는 GET 미작동."

  - id: jbtp
    name: 전북테크노파크
    enabled: true
    status: ok
    url: "https://jbcis.jbtp.or.kr/main/"
    base: "https://jbcis.jbtp.or.kr"
    notes: >
      www.jbtp.or.kr 은 접속 불가라 같은 사업공고를 싣는 전북 기업관리시스템(jbcis)으로 교체.
      2차 진단에서 20건 수집 확인. 다만 이 화면에는 게시일이 없고 마감일시만 있어
      모든 공고가 '게시일 미확인'으로 표시된다. 상세 링크는 www.jbtp.or.kr 로 연결되므로
      접속이 안 되면 브라우저에서 직접 열어야 할 수 있음.

  - id: jcia
    name: 전남정보문화산업진흥원
    enabled: true
    status: ok
    url: "https://www.jcia.or.kr/cf/information/notice/business.do"
    base: "https://www.jcia.or.kr/cf/information/notice/"
    link_from_onclick: "fn_view\\('([^']+)'\\)"
    notes: "상단 '공지' 고정행 6개 있음. 상세는 fn_view() JS 호출이라 상세 URL 조립 불가 → 목록 URL로 대체."

  - id: jbf
    name: 전남바이오진흥원
    enabled: true
    status: ok
    url: "https://jbf.kr/index.do?contentId=429"
    base: "https://jbf.kr/"
    notes: "사업공고가 별도 게시판이 아니라 제목 '[사업공고]' 접두어로 구분. 세션 쿠키 유지 필요."

  - id: gicon
    name: 광주정보문화산업진흥원
    enabled: true
    status: check
    url: "https://www.gicon.or.kr/menu.es?mid=a10204000000"
    base: "https://www.gicon.or.kr/"
    notes: "정부 공통 CMS(board.es). robots 차단으로 미검증. 구 도메인 gitct.or.kr은 폐기됨."

  - id: gjep
    name: 광주경제진흥상생일자리재단
    enabled: true
    status: check
    url: "https://www.gjep.or.kr/cms/bbs/cms.php?dk_cms=comm_01"
    base: "https://www.gjep.or.kr"
    notes: "구 광주경제고용진흥원. robots 전체 Disallow라 미검증. 기업마당에 재게시되므로 대안 있음."

  # ---------- 3. 중앙부처 ----------
  - id: motir
    name: 산업통상부
    enabled: true
    status: ok
    url: "https://www.motir.go.kr/kor/article/ATCL2826a2625"
    base: "https://www.motir.go.kr"
    notes: "2025-10-01 개편으로 산업통상자원부→산업통상부, motie.go.kr→motir.go.kr. 구 도메인은 인증서 오류."

  - id: mss
    name: 중소벤처기업부
    enabled: true
    status: ok
    url: "https://www.mss.go.kr/site/smba/ex/bbs/List.do?cbIdx=310"
    base: "https://www.mss.go.kr"
    link_from_onclick: "doBbsFView\\('\\d+','(\\d+)'"
    detail_url: "https://www.mss.go.kr/site/smba/ex/bbs/View.do?cbIdx=310&bcIdx={id}&parentSeq={id}"
    notes: "목록에 신청기간이 함께 노출되는 드문 사이트. 링크는 onclick의 doBbsFView 2번째 인자."

  - id: mohw
    name: 보건복지부
    enabled: true
    status: ok
    url: "https://www.mohw.go.kr/board.es?mid=a10501010200&bid=0003&cg_code=C01"
    base: "https://www.mohw.go.kr"
    notes: "공모/모집 공고와 행정처분·법인설립 공고가 혼재 → 제외 키워드 필수."

  - id: mafra
    name: 농림축산식품부
    enabled: true
    status: ok
    url: "https://www.mafra.go.kr/bbs/home/791/artclList.do"
    base: "https://www.mafra.go.kr"
    notes: "사람이 보는 /home/5108/subview.do(770KB) 대신 경량 엔드포인트(24KB). 날짜가 td가 아니라 dd.date에 있음."

  - id: iris
    name: 범부처통합연구지원시스템(IRIS)
    enabled: true
    status: ok
    url: "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituListView.do"
    base: "https://www.iris.go.kr"
    row_selector: "ul.dbody > li"
    link_from_onclick: "_view\\('(\\d+)'"
    detail_url: "https://www.iris.go.kr/contents/retrieveBsnsAncmView.do?ancmId={id}&ancmPrg=ancmIng"
    notes: "로그인 불필요. 표가 아니라 ul/li 구조라 선택자 지정 필수. GET으로는 '접수중' 탭만 수집됨."

  - id: betterfuture
    name: 저출산고령사회위원회
    enabled: true
    status: ok
    url: "https://www.betterfuture.go.kr/front/notificationSpace/frontNotice.do"
    base: "https://www.betterfuture.go.kr"
    link_from_onclick: "getDetailContent\\('[^']*','(\\d+)'\\)"
    detail_url: "https://www.betterfuture.go.kr/front/notificationSpace/frontNoticeDetail.do?articleId={id}"
    notes: "기업 지원사업 공고는 거의 없고 정책 공지 위주. 적합도 낮으나 유지."

  # ---------- 4. 진흥원·공공기관 ----------
  - id: nipa
